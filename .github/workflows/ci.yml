name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # O projeto declara features "4.7" em simulator/project.godot. Abrir com
  # outra minor reimporta recurso e muda comportamento sem avisar, então a
  # versão fica presa aqui.
  GODOT_VERSION: 4.7.1-stable

jobs:
  estatistica:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: cache do Godot headless
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: baixar o Godot headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # A primeira abertura importa os recursos e escreve .godot/. Sem isso o
      # --script roda antes do projeto existir e falha por caminho não
      # resolvido, não por teste quebrado. O `|| true` é porque a importação
      # sai com código diferente de zero em ambiente sem display mesmo quando
      # dá certo — o que vale é o passo seguinte.
      - name: importar os recursos
        run: ~/godot/godot --headless --path simulator --import || true

      - name: regressão dos testes de significância
        run: ~/godot/godot --headless --path simulator --script res://tests/test_stats.gd

      - name: regressão do ambiente
        run: ~/godot/godot --headless --path simulator --script res://tests/test_ambiente.gd

      # O site de demonstração desenha o que esta ferramenta grava. Se ela
      # quebrar, o site passa a mostrar dados velhos sem avisar ninguém —
      # então duas partidas rodam a cada push, e o JSON é conferido.
      - name: exportar partidas para o site
        run: |
          ~/godot/godot --headless --path simulator \
            --script res://tools/replay_dump.gd -- partidas=2 saida=/tmp/replays.json

      - name: conferir o JSON exportado
        run: |
          python3 - <<'PY'
          import json, sys

          d = json.load(open('/tmp/replays.json'))
          assert d['escalacao'] == ['art3miz', 'heuristica', 'reativa'], d['escalacao']
          assert len(d['partidas']) == 2, len(d['partidas'])

          for p in d['partidas']:
              mapa = p['mapa']
              assert len(mapa['celulas']) == mapa['altura'], 'altura do mapa'
              assert all(len(l) == mapa['largura'] for l in mapa['celulas']), 'largura do mapa'
              celulas = ''.join(mapa['celulas'])
              assert set(celulas) <= set('.#lH'), 'celula desconhecida'
              # Erro de script no GDScript nao aborta a execucao: um grid que
              # nasceu vazio produz um mapa todo "." e uma partida que parece
              # ter rodado. O gerador sempre poe paredes e cobertura.
              assert '#' in celulas, 'mapa sem parede -- grid vazio?'
              assert 'l' in celulas or 'H' in celulas, 'mapa sem cobertura'
              assert p['quadros'], 'partida sem quadros'
              assert p['vencedor'] in ('verde', 'vermelho', 'azul', 'draw'), p['vencedor']
              for q in p['quadros']:
                  assert len(q['agentes']) == 3, 'quadro sem os tres agentes'
                  for a in q['agentes']:
                      assert 0 <= a['x'] < mapa['largura'], 'agente fora do mapa'
                      assert 0 <= a['y'] < mapa['altura'], 'agente fora do mapa'
                      assert 0 <= a['hp'] <= 100, a['hp']

          print('ok: %d partidas, %d quadros' % (
              len(d['partidas']), sum(len(p['quadros']) for p in d['partidas'])))
          PY
